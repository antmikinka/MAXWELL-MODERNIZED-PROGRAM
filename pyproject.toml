[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell"
version = "1.0.0"
description = "A computational implementation of Maxwell's 1873 Treatise on Electricity and Magnetism — all 866 articles, CGS-EMU units, citation-traceable."
readme = "README.md"
# Software license for PyPI / SPDX. Documentation, paper, and scholarly
# content are CC BY 4.0 (see LICENSE-CONTENT). Maxwell 1873 text is PD.
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Anthony Mikinka", email = "67480807+antmikinka@users.noreply.github.com"},
    {name = "Maxwell Modernization Project"},
]
keywords = [
    "maxwell",
    "electromagnetism",
    "physics",
    "electromagnetic",
    "maxwell-equations",
    "classical-physics",
    "electrostatics",
    "magnetism",
    "electrodynamics",
    "computational-physics",
    "cgs-units",
    "spherical-harmonics",
    "maxwell-treatise",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Natural Language :: English",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
enhanced = [
    "httpx>=0.25.0",
    "orjson>=3.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]
viz = [
    "matplotlib>=3.5.0",
    "Pillow>=10.0",
]
symbolic = [
    "sympy>=1.12",
]
accel = [
    "jax>=0.4.0",
]
ui = [
    "streamlit>=1.20.0",
    "sympy>=1.12",
    "matplotlib>=3.5.0",
]
all = [
    "maxwell[dev,enhanced,viz,symbolic,accel,ui]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "jax: tests requiring JAX (accel extra)",
    "sympy: tests requiring SymPy (symbolic extra)",
    "slow: tests that take a long time to run",
    "visualization: tests for matplotlib visualization",
]

[project.urls]
Homepage = "https://github.com/antmikinka/MAXWELL-MODERNIZED-PROGRAM"
Documentation = "https://github.com/antmikinka/MAXWELL-MODERNIZED-PROGRAM#readme"
Repository = "https://github.com/antmikinka/MAXWELL-MODERNIZED-PROGRAM.git"
"Bug Tracker" = "https://github.com/antmikinka/MAXWELL-MODERNIZED-PROGRAM/issues"
Changelog = "https://github.com/antmikinka/MAXWELL-MODERNIZED-PROGRAM/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxwell*"]
exclude = ["tests*", "agents*", "archive*", ".claude*", ".pytest_cache*", ".benchmarks*", "maxwell.egg-info*"]

[tool.setuptools.package-data]
maxwell = ["*.json", "*.md"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = [
    "dict-item",
    "var-annotated",
    "valid-type",
    "name-defined",
    "str-bytes-safe",
    "no-redef",
    "union-attr",
    "attr-defined",
    "has-type",
    "list-item",
    "arg-type",
    "assignment",
    "return-value",
    "return",
    "call-arg",
    "call-overload",
    "operator",
    "misc",
    "index",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
