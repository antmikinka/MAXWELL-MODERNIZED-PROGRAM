[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell"
version = "0.1.0"
description = "A computational implementation of Maxwell's 1873 Treatise on Electricity and Magnetism — all 866 articles, CGS-EMU units, citation-traceable."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Anthony Mikinka", email = "anthony.mikinka@gmail.com"},
    {name = "Maxwell Modernization Project"},
]
keywords = [
    "maxwell",
    "electromagnetism",
    "physics",
    "electromagnetic",
    "maxwell-equations",
    "classical-physics",
    "electrostatics",
    "magnetism",
    "electrodynamics",
    "computational-physics",
    "cgs-units",
    "spherical-harmonics",
    "maxwell-treatise",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
enhanced = [
    "httpx>=0.25.0",
    "orjson>=3.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]
viz = [
    "matplotlib>=3.5.0",
]
symbolic = [
    "sympy>=1.12",
]
accel = [
    "jax>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/maxwell-treatise/modernized-program"
Documentation = "https://github.com/maxwell-treatise/modernized-program#readme"
Repository = "https://github.com/maxwell-treatise/modernized-program.git"
"Bug Tracker" = "https://github.com/maxwell-treatise/modernized-program/issues"
Changelog = "https://github.com/maxwell-treatise/modernized-program/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxwell*"]
exclude = ["tests*", "agents*", "archive*", ".claude*", ".pytest_cache*", ".benchmarks*", "maxwell.egg-info*"]

[tool.setuptools.package-data]
maxwell = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
