name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - feat/pypi-package

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/maxwell
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/pypi-package'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Upload to Test PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  smoke-test-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Test PyPI propagation
        run: sleep 60

      - name: Install from Test PyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ maxwell

      - name: Smoke test imports
        run: |
          python -c "import maxwell; print(f'maxwell {maxwell.__version__}')"
          python -c "from maxwell.core.charge import PointCharge; print('Core OK')"
          python -c "from maxwell.electromagnetism.forces.lorentz import LorentzForce; print('EM OK')"

  smoke-test:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for PyPI propagation
        run: sleep 60

      - name: Install from PyPI
        run: |
          pip install maxwell[accel]

      - name: Smoke test imports
        run: |
          python -c "import maxwell; print(f'maxwell {maxwell.__version__}')"
          python -c "from maxwell.core.charge import PointCharge; print('Core OK')"
          python -c "from maxwell.jax.core.charge import PointChargeJAX; print('JAX OK')"
          python -c "from maxwell.math.spherical_harmonics import SphericalHarmonicExpansion; print('Math OK')"
          python -c "from maxwell.electromagnetism.forces.lorentz import LorentzForce; print('EM OK')"
