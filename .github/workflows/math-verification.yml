name: Mathematics Verification

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "maxwell/**/*.py"
  pull_request:
    branches: [main]
    paths:
      - "maxwell/**/*.py"

jobs:
  math-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,accel,viz,symbolic]"

      # ── 1. Dimensional analysis verification ──────────────────────────
      - name: Verify dimensional consistency
        run: |
          python -c "
          from maxwell.core.units import verify_dimensional_consistency, MagneticDimensions
          # Verify dimensions of key physical quantities
          assert verify_dimensional_consistency('charge'), 'Charge dimensions inconsistent'
          assert verify_dimensional_consistency('magnetic_field'), 'Magnetic field dimensions inconsistent'
          assert verify_dimensional_consistency('potential'), 'Potential dimensions inconsistent'
          print('Dimensional analysis: PASS')
          "

      # ── 2. Speed of light from EM units ───────────────────────────────
      - name: Verify ESU/EMU ratio equals c
        run: |
          python -c "
          from maxwell.core.units import verify_speed_of_light_relationship
          result = verify_speed_of_light_relationship()
          assert result['verified'], f'ESU/EMU ratio not verified: {result}'
          assert result['max_deviation'] == 0.0, f'Max deviation {result[\"max_deviation\"]}'
          ratio = result['c_from_charge'] / result['c_accepted']
          assert abs(ratio - 1.0) < 1e-10, f'ESU/EMU ratio/c = {ratio}, expected 1.0'
          print(f'Speed of light from EM units: PASS (ratio/c = {ratio:.15f})')
          print(f'  Max deviation: {result[\"max_deviation\"]}')
          "

      # ── 3. Vector calculus identities ─────────────────────────────────
      - name: Verify vector calculus identities
        run: |
          python -c "
          import numpy as np
          from maxwell.math.vector_operators import (
              gradient,
              divergence,
              curl,
              laplacian,
              identity_curl_grad_zero,
              identity_div_curl_zero,
          )

          # curl(grad phi) = 0 for any scalar field
          def phi(x, y, z):
              return x**3 + y**3 + z**3

          # Verify at multiple points
          for pt in [(1.0, 0.0, 0.0), (1.0, 1.0, 1.0), (2.0, -1.0, 0.5)]:
              assert identity_curl_grad_zero(phi, *pt), f'curl(grad phi) != 0 at {pt}'

          # div(curl F) = 0 for any vector field F
          def Fx(x, y, z):
              return x**2 * y

          def Fy(x, y, z):
              return y**2 * z

          def Fz(x, y, z):
              return z**2 * x

          for pt in [(1.0, 1.0, 1.0), (2.0, 0.5, 1.5)]:
              assert identity_div_curl_zero(Fx, Fy, Fz, *pt), f'div(curl F) != 0 at {pt}'

          # Also verify gradient returns correct shape
          g = gradient(phi, 1.0, 1.0, 1.0)
          assert len(g) == 3, f'gradient returned {len(g)} components'

          print('Vector calculus identities: PASS')
          "

      # ── 4. Spherical harmonics ────────────────────────────────────────
      - name: Verify spherical harmonics
        run: |
          python -c "
          import numpy as np
          from maxwell.math.spherical_harmonics import (
              calc_legendre_polynomial,
              addition_theorem,
              verify_addition_theorem,
          )

          # P_0(x) = 1
          assert abs(calc_legendre_polynomial(0, 0.5) - 1.0) < 1e-10
          # P_1(x) = x
          assert abs(calc_legendre_polynomial(1, 0.5) - 0.5) < 1e-10
          # P_2(x) = (3x^2 - 1)/2
          expected = (3 * 0.5**2 - 1) / 2
          assert abs(calc_legendre_polynomial(2, 0.5) - expected) < 1e-10

          # addition_theorem contract: returns P_l(cos gamma) computed as
          # (4*pi/(2l+1)) * sum_m Y_lm(dir1) * conj(Y_lm(dir2)).
          # Same direction -> gamma = 0 -> P_l(1) = 1 for every l.
          val = addition_theorem(1, 0, 0, 0, 0)
          assert abs(val - 1.0) < 1e-8, f'addition_theorem(1, same dir) = {val}'

          # Non-trivial angle: the sum side must equal direct P_l evaluation,
          # and the module's own identity verifier must agree, for l = 0..3.
          th1, ph1, th2, ph2 = 0.7, 0.2, 1.1, 2.0
          cos_gamma = (np.sin(th1) * np.sin(th2) * np.cos(ph1 - ph2)
                       + np.cos(th1) * np.cos(th2))
          for L in range(4):
              direct = calc_legendre_polynomial(L, cos_gamma)
              via_sum = addition_theorem(L, th1, ph1, th2, ph2)
              assert abs(via_sum - direct) < 1e-9, f'l={L}: {via_sum} != {direct}'
              check = verify_addition_theorem(L, th1, ph1, th2, ph2)
              assert check['verified'], f'verify_addition_theorem l={L}: {check}'

          print('Spherical harmonics: PASS')
          "

      # ── 5. Maxwell equations ──────────────────────────────────────────
      - name: Verify Maxwell equations with test fields
        run: |
          python -c "
          import numpy as np
          from maxwell.config.constants import C
          from maxwell.electromagnetism.theory.general_equations import (
              MaxwellEquations,
              verify_maxwell_equations,
          )

          # Comprehensive self-verification: equations (A)-(G) + both Gauss laws
          result = verify_maxwell_equations()
          assert bool(result['all_verified']), f'Not verified: {result}'
          assert len(result['equations_tested']) == 9, result['equations_tested']
          for key in ('faraday_A', 'general_emf_B', 'ponderomotive_C',
                      'magnetic_induction_D', 'ampere_maxwell_E',
                      'electric_displacement_F', 'conduction_current_G',
                      'gauss_electric', 'gauss_magnetic'):
              assert bool(result[key]['verified']), f'{key}: {result[key]}'

          # Direct class usage against independently computed expectations
          eq = MaxwellEquations()  # vacuum CGS: eps = mu = 1, sigma = 0
          E = np.array([100.0, 0.0, 0.0])

          # (F) D = eps*E -> D = E in vacuum
          D = eq.equation_F_electric_displacement(E)
          assert np.allclose(D, E), f'D = eps*E failed: {D}'

          # (G) J = sigma*E -> J = 0 for a perfect dielectric
          J = eq.equation_G_conduction_current(E)
          assert np.allclose(J, 0.0), f'J = sigma*E with sigma=0 failed: {J}'

          # (A) curl E = -(1/c) dB/dt
          dB_dt = np.array([0.0, 0.0, 1e10])
          curl_E = eq.equation_A_faraday(dB_dt)
          assert np.allclose(curl_E, -(1.0 / C) * dB_dt), f'Faraday: {curl_E}'

          # (D) B = H + 4*pi*M
          H = np.array([1.0, 0.0, 0.0])
          M = np.array([0.0, 2.0, 0.0])
          B = eq.equation_D_magnetic_induction(H, M)
          assert np.allclose(B, H + 4.0 * np.pi * M), f'B = H + 4piM: {B}'

          print('Maxwell equations: PASS (9/9 equations verified, 4 direct checks)')
          "

      # ── 6. Gauss's law for point charge ───────────────────────────────
      - name: Verify Coulomb field satisfies Gauss law
        run: |
          python -c "
          import numpy as np
          from maxwell.core.charge import PointCharge

          # Point charge: E = q * r_hat / r^2
          # Gauss law: flux through sphere = 4*pi*q (CGS)
          q = 1.0
          charge = PointCharge(q=q, position=np.array([0.0, 0.0, 0.0]))

          # Numerical flux through unit sphere
          n_points = 1000
          np.random.seed(42)
          theta = np.arccos(2 * np.random.rand(n_points) - 1)
          phi = 2 * np.pi * np.random.rand(n_points)
          r = 1.0

          flux = 0.0
          for th, ph in zip(theta, phi):
              x = r * np.sin(th) * np.cos(ph)
              y = r * np.sin(th) * np.sin(ph)
              z = r * np.cos(th)
              point = np.array([x, y, z])
              E = charge.field_at(point)
              n_hat = point / r
              dA = 4 * np.pi * r**2 / n_points
              flux += np.dot(E, n_hat) * dA

          expected_flux = 4 * np.pi * q
          error = abs(flux - expected_flux) / expected_flux
          assert error < 0.05, f'Gauss law error: {error:.4f}'
          print(f'Gauss law (Monte Carlo, N={n_points}): PASS (error={error:.4f})')
          "

      # ── 7. Energy conservation in EM fields ───────────────────────────
      - name: Verify energy density formulas
        run: |
          python -c "
          import numpy as np
          from maxwell.electromagnetism.energy.magnetic import (
              calc_magnetic_energy_density,
              calc_magnetic_energy_density_from_B,
          )
          from maxwell.electromagnetism.energy.electrostatic import calc_electrostatic_energy_density

          # Magnetic (Art. 632): u = (mu/8pi) H^2 ; vacuum mu = 1
          H = np.array([1000.0, 0.0, 0.0])
          u_mag = calc_magnetic_energy_density(H)
          expected_u_mag = 1000.0**2 / (8 * np.pi)
          assert abs(u_mag - expected_u_mag) < 1e-6, f'{u_mag} != {expected_u_mag}'

          # B-form: u = B^2/(8*pi*mu); with B = H in vacuum both must agree
          B = np.array([1000.0, 0.0, 0.0])
          u_mag_B = calc_magnetic_energy_density_from_B(B)
          assert abs(u_mag_B - expected_u_mag) < 1e-6, f'{u_mag_B} != {expected_u_mag}'

          # Medium cross-check, mu = 2: both forms agree when B = mu*H
          mu = 2.0
          u_H_mu = calc_magnetic_energy_density(H, permeability=mu)
          u_B_mu = calc_magnetic_energy_density_from_B(mu * H, permeability=mu)
          assert abs(u_H_mu - u_B_mu) < 1e-6, f'{u_H_mu} != {u_B_mu}'
          assert abs(u_H_mu - mu * 1000.0**2 / (8 * np.pi)) < 1e-6

          # Electrostatic (Art. 630): u = (eps/8pi) E^2 ; vacuum eps = 1
          E = np.array([100.0, 0.0, 0.0])
          u_es = calc_electrostatic_energy_density(E)
          expected_u_es = 100.0**2 / (8 * np.pi)
          assert abs(u_es - expected_u_es) < 1e-6, f'{u_es} != {expected_u_es}'
          u_es_eps = calc_electrostatic_energy_density(E, permittivity=2.5)
          assert abs(u_es_eps - 2.5 * 100.0**2 / (8 * np.pi)) < 1e-6

          print('Energy density verification: PASS')
          print(f'  Magnetic (H=1000 Oe): {u_mag:.6f} erg/cm^3')
          print(f'  Electrostatic (E=100): {u_es:.6f} erg/cm^3')
          "

      # ── 8. Elliptic integrals ─────────────────────────────────────────
      - name: Verify elliptic integral values
        run: |
          python -c "
          import numpy as np
          from maxwell.math.elliptic_integrals import (
              calc_complete_elliptic_integral_first_kind,
              calc_complete_elliptic_integral_second_kind,
          )

          # K(0) = pi/2, E(0) = pi/2
          K0 = calc_complete_elliptic_integral_first_kind(0.0)
          E0 = calc_complete_elliptic_integral_second_kind(0.0)
          assert abs(K0 - np.pi/2) < 1e-10, f'K(0) = {K0}'
          assert abs(E0 - np.pi/2) < 1e-10, f'E(0) = {E0}'

          print('Elliptic integrals: PASS')
          "

      # ── 9. Constitutive relations ─────────────────────────────────────
      - name: Verify constitutive relations
        run: |
          python -c "
          import numpy as np
          from maxwell.materials.constitutive import Magnetization, Permeability, Conductivity

          # B = mu * H = (1 + 4*pi*chi) * H
          chi = 100.0
          mat = Magnetization(susceptibility=chi)
          H = np.array([1.0, 0.0, 0.0])
          B = mat.magnetic_induction(H_field=H)
          expected_B = (1 + 4 * np.pi * chi) * H
          assert np.allclose(B, expected_B, atol=1e-10)

          # J = sigma * E
          sigma = 5.96e7  # copper conductivity
          cond = Conductivity(conductivity=sigma)

          print('Constitutive relations: PASS')
          "

      # ── 10. Full test suite ───────────────────────────────────────────
      - name: Run full test suite
        run: |
          pytest tests/ -v --tb=short -q

      # ── Summary ───────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo "Mathematics Verification Pipeline Complete"
          echo "==========================================="
          echo "1. Dimensional analysis"
          echo "2. Speed of light from EM units"
          echo "3. Vector calculus identities"
          echo "4. Spherical harmonics"
          echo "5. Maxwell equations"
          echo "6. Gauss law (Monte Carlo)"
          echo "7. Energy density formulas"
          echo "8. Elliptic integrals"
          echo "9. Constitutive relations"
          echo "10. Full test suite"
