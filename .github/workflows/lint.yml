name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install mypy>=1.0.0 black>=23.0.0 isort>=5.12.0

      - name: Check formatting with Black
        run: |
          black --check maxwell/ tests/

      - name: Check import ordering with isort
        run: |
          isort --check-only --diff maxwell/ tests/

      - name: Type checking with mypy
        run: |
          mypy maxwell/
