name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,accel]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -q

      - name: Verify imports
        run: |
          python -c "import maxwell; print(f'maxwell {maxwell.__version__}')"
          python -c "from maxwell.core.charge import PointCharge; print('OK')"
          python -c "from maxwell.electromagnetism.forces.lorentz import LorentzForce; print('OK')"
          python -c "from maxwell.math.spherical_harmonics import SphericalHarmonicExpansion; print('OK')"
